<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Board | PLANIT AI</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">
    <header class="bg-white border-b border-gray-200">
        <nav class="max-w-7xl mx-auto p-4 flex flex-wrap items-center gap-5">
            <a href="index.html" class="mr-auto">
                <img src="data/images/logo%20Planit.png" alt="PLANIT AI" class="w-40">
            </a>
            <a href="index.html" class="hover:text-purple-600">Dashboard</a>
            <a href="new-project.html" class="hover:text-purple-600">Nouveau projet</a>
            <button id="ouvrir-settings" type="button" class="border border-gray-200 p-2 rounded-lg hover:bg-gray-50" disabled>Paramètres IA</button>
        </nav>
    </header>

    <main class="p-6 flex-1">
        <h1 class="text-3xl font-bold">Task Board</h1>
    </main>

    <div id="task-modal" role="dialog" aria-modal="true" aria-labelledby="task-heading" class="hidden fixed inset-0 z-20 bg-black bg-opacity-50 overflow-y-auto p-4">
        <section class="bg-white rounded-xl p-6 max-w-2xl mx-auto my-8">
            <div class="flex items-center justify-between gap-4 mb-5">
                <h2 id="task-heading" class="text-xl font-bold text-purple-700"></h2>
                <button id="fermer-tache" type="button" class="text-gray-500 p-2" aria-label="Fermer le détail" disabled>✕</button>
            </div>
            <form id="task-form" novalidate>
                <label for="edit-title" class="block font-bold mb-2">Titre</label>
                <input disabled id="edit-title" type="text" required maxlength="300" class="w-full border border-gray-300 p-3 rounded-lg mb-5">
                <label for="edit-description" class="block font-bold mb-2">Description</label>
                <textarea disabled id="edit-description" rows="4" required class="w-full border border-gray-300 p-3 rounded-lg mb-5"></textarea>
                <div class="flex flex-col md:flex-row gap-4 mb-5">
                    <div class="flex-1">
                        <label for="edit-priority" class="block font-bold mb-2">Priorité</label>
                        <select disabled id="edit-priority" class="w-full border border-gray-300 p-3 rounded-lg">
                            <option>Low</option><option>Medium</option><option>High</option><option>Critical</option>
                        </select>
                    </div>
                    <div class="flex-1">
                        <label for="edit-size" class="block font-bold mb-2">Taille</label>
                        <select disabled id="edit-size" class="w-full border border-gray-300 p-3 rounded-lg">
                            <option>XS</option><option>S</option><option>M</option><option>L</option><option>XL</option>
                        </select>
                    </div>
                </div>
                <div class="flex flex-col md:flex-row gap-4 mb-5">
                    <div class="flex-1">
                        <label for="edit-deadline" class="block font-bold mb-2">Deadline (jour)</label>
                        <input disabled id="edit-deadline" type="number" min="1" step="1" required class="w-full border border-gray-300 p-3 rounded-lg">
                    </div>
                    <div class="flex-1">
                        <label for="edit-status" class="block font-bold mb-2">Statut</label>
                        <select disabled id="edit-status" class="w-full border border-gray-300 p-3 rounded-lg">
                            <option>To Do</option><option>In Progress</option><option>Done</option>
                        </select>
                    </div>
                </div>
                <h3 class="font-bold mt-6 mb-2">User stories</h3>
                <ul id="task-stories" class="list-disc pl-5 text-gray-600 text-sm"></ul>
                <h3 class="font-bold mt-5 mb-2">Critères d'acceptation</h3>
                <ul id="task-criteria" class="list-disc pl-5 text-gray-600 text-sm"></ul>
                <div class="bg-gray-50 rounded-lg p-4 mt-5 text-sm text-gray-600">
                    <p>Importance : <span id="task-importance"></span></p>
                    <p class="mt-2">Estimation : <span id="task-time"></span></p>
                    <p class="mt-2 break-words">Dépendances : <span id="task-dependencies"></span></p>
                </div>
                <p id="task-error" role="alert" class="text-red-600 text-sm mt-4"></p>
                <div class="flex flex-wrap gap-3 mt-5">
                    <button type="submit" disabled class="bg-purple-600 hover:bg-purple-700 text-white p-3 rounded-lg">Enregistrer</button>
                    <button id="delete-task" type="button" class="bg-red-50 text-red-600 p-3 rounded-lg" disabled>Supprimer</button>
                </div>
            </form>
        </section>
    </div>


    <footer class="text-center text-sm text-gray-500 p-6">PLANIT AI · Des idées claires. Des projets qui avancent.</footer>
</body>
</html>
